<!DOCTYPE HTML>
<html lang="ko">
    <head>
        <title>할인율 계산기
        </title>
</head>
 <body>
    <div id="contents">
        <ul>

            <li>
               <label>상품가격</label>
               <input type="text" id="oprice">원
            </li>

            <li>
                <label>할인율</label>
                <input type="text" id="rate">%
            </li>
            <li>
                <button onclick="showPrice()">할인 가격 계산하기</button>

        </ul>
        <div id="showResult"></div>
    </div>
    <script>
        function showPrice() {
            var oprice = document.querySelector("#oprice").value;
            var rate = document.querySelector("#rate").value;
            var savedPrice = oprice * (rate / 100);
            var resultprice = oprice - savedPrice;

            
            document.querySelector('#showResult').innerHTML = "상품의 원래 가격은" +
       oprice + "원이고, 할인율은" + rate + "%입니다. " + savedPrice + "원을 절약한 " + resultprice + 
       "원에 구매할 수 있습니다."
        }
    </script>


 </body>
</html>
