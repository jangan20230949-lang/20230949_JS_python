<!DOCTYPE HTML>
<html lang="ko">
    <head>
        <title>상품 가격 계산기
        </title>
</head>
 <body>
    <div id="contents">
        <ul>

            <li>
               <label>1상품가격</label>
               <input type="text" id="oprice1">원
            </li>

           <li>
               <label>2상품가격</label>
               <input type="text" id="oprice2">원
            </li>

             <li>
               <label>3상품가격</label>
               <input type="text" id="oprice3">원
             </li>

            <li>
                <button onclick="showPrice()">상품 가격 계산하기</button>
            </li>

        </ul>
        <div id="showResult"></div>
    </div>
    <script>
        function showPrice() {
            var oprice1 = Number(document.querySelector("#oprice1").value);
            var oprice2 = Number(document.querySelector("#oprice2").value);
            var oprice3 = Number(document.querySelector("#oprice3").value);
            var totalPrice = oprice1 + oprice2 + oprice3;

            var grade;

            var rate; if 
            (totalPrice >= 50000) { grade = "VIP"; rate = 3; } 
            else if (totalPrice >= 30000) { grade = "골드"; rate = 2; } 
            else { grade = "실버"; rate = 1; }

            var point = totalPrice * (rate / 100);

           
            var savedPrice = totalPrice * (rate / 100);
            var resultprice = totalPrice - savedPrice;

            
            document.querySelector('#showResult').innerHTML = "통합 가격은" +
       totalPrice + "원이고 " + rate +"% 적립됩니다 따라서 " + grade +" 등급이며 적립 금액은 "
        + point + "원입니다. " 
        }
    </script>


 </body>
</html>
