<!DOCTYPE HTML>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta  name="viewport"  content="width=device-width,initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>나이 계산기</title>
        <style>
         body {
            text-align: center;
            font-size: 1.9em;}
            </style>
</head>
 <body>

        <h2>나이 계산기</h2>
    <script>
        var birthYear = prompt("출생년도를 입력하세요");
        var currentYear = new Date().getFullYear();
        var age = currentYear - birthYear + 1;
        document.write(birthYear + "년생 " + age + "세입니다");
    </script>
 </body>
</html>
